name: Bug report
description: Report a bug in Ghis.PowershellLib
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide steps or a minimal code sample that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or stack traces if available.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package/Library Version
      description: Which version of Ghis.PowershellLib are you using?
      placeholder: e.g. 1.0.3
    validations:
      required: false

  - type: input
    id: dotnet
    attributes:
      label: .NET Version
      description: Output of `dotnet --version` or target framework.
      placeholder: e.g. net10.0 / 10.0.x
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Logs, screenshots, or any other relevant context.
    validations:
      required: false
