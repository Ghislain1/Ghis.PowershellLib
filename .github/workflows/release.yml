name: Release

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check schedule cadence
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 3)) -eq 1 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: windows-latest
    environment: production
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Restore
        run: dotnet restore Ghis.PowershellLib.sln

      - name: Build
        run: dotnet build Ghis.PowershellLib.sln -c Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test
        run: dotnet test Ghis.PowershellLib.sln -c Release --no-build --verbosity normal

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
            $prerelease = "false"
            $publish = "true"
          }
          elseif ("${{ github.event_name }}" -eq "schedule") {
            $version = "0.0.0-triweekly.$date.${{ github.run_number }}"
            $tag = "triweekly/$version"
            $prerelease = "true"
            $publish = "false"
          }
          else {
            $version = "0.0.0-daily.$date.${{ github.run_number }}"
            $tag = "daily/$version"
            $prerelease = "true"
            $publish = "false"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet pack Ghis.Powershell.Lib/Ghis.Powershell.Lib.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.version.outputs.version }} /p:Version=${{ steps.gitversion.outputs.semVer }}
          Get-ChildItem artifacts -Filter *.nupkg | Select-Object -ExpandProperty FullName

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: Create GitHub release
        if: ${{ github.ref_type != 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag artifacts/*.nupkg --generate-notes --prerelease --title $tag

      - name: Create GitHub release (tag)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifacts/*.nupkg --generate-notes --title $tag
          }
          else {
            gh release upload $tag artifacts/*.nupkg --clobber
          }

      - name: NuGet login (OIDC)
        if: ${{ steps.version.outputs.publish == 'true' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet (Trusted Publishing)
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if (-not $packages) { throw "No .nupkg files found in artifacts." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
