name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ghis.PowershellLib.sln

      - name: Build
        run: dotnet build Ghis.PowershellLib.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ghis.PowershellLib.sln -c Release --no-build --verbosity normal

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          }
          else {
            $version = "0.0.0-weekly.$(Get-Date -Format 'yyyyMMdd').${{ github.run_number }}"
            $tag = "weekly/$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack Ghis.Powershell.Lib/Ghis.Powershell.Lib.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: Create GitHub release
        if: ${{ github.ref_type != 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag artifacts/*.nupkg --generate-notes --prerelease --title $tag

      - name: NuGet login (OIDC)
        if: ${{ github.ref_type == 'tag' && secrets.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet (Trusted Publishing)
        if: ${{ github.ref_type == 'tag' && steps.nuget_login.outputs.NUGET_API_KEY != '' }}
        shell: pwsh
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to NuGet (API key fallback)
        if: ${{ github.ref_type == 'tag' && steps.nuget_login.outputs.NUGET_API_KEY == '' && secrets.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
