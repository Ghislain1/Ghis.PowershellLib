name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ghis.PowershellLib.sln

      - name: Build
        run: dotnet build Ghis.PowershellLib.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ghis.PowershellLib.sln -c Release --no-build --verbosity normal
